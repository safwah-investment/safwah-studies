/* =========================================================
   SAFWAH INVESTMENT
   Investment Studies & Analysis Center
========================================================= */

:root{
    --navy:#071c2c;
    --navy2:#0c2a3d;
    --navy3:#12384c;
    --gold:#c5a35a;
    --gold2:#e0c783;
    --cream:#f6f2e8;
    --paper:#ffffff;
    --text:#17212b;
    --muted:#68737c;
    --line:#e7e2d8;
    --green:#2e6758;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    background:#f7f7f5;
    color:var(--text);
    line-height:1.9;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    background:#04131f;
    color:#cdd5da;
    font-size:13px;
    padding:8px 0;
}

.topbar-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.topbar-en{
    direction:ltr;
}


/* =========================================================
   NAV
========================================================= */

.nav{
    background:rgba(7,28,44,.98);
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    z-index:999;
}

.nav-inner{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    color:white;
}

.brand-mark{
    width:48px;
    height:48px;
    border:2px solid var(--gold);
    transform:rotate(45deg);
    display:flex;
    align-items:center;
    justify-content:center;
}

.brand-mark span{
    transform:rotate(-45deg);
    color:var(--gold2);
    font-weight:800;
    font-size:18px;
}

.brand-text strong{
    display:block;
    color:white;
    font-size:18px;
    line-height:1.25;
}

.brand-text small{
    color:var(--gold2);
    font-size:11px;
    letter-spacing:1.5px;
    direction:ltr;
    display:block;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:24px;
}

.nav-links a{
    color:#e7ecef;
    font-size:14px;
    transition:.2s;
}

.nav-links a:hover{
    color:var(--gold2);
}

.nav-button{
    border:1px solid var(--gold);
    color:var(--gold2)!important;
    padding:8px 15px;
    border-radius:4px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    background:
        radial-gradient(circle at 15% 20%,rgba(197,163,90,.17),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(197,163,90,.10),transparent 27%),
        linear-gradient(135deg,#061a29 0%,#0b2b3f 55%,#071c2c 100%);
    color:white;
    position:relative;
    overflow:hidden;
}

.hero:before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border:1px solid rgba(197,163,90,.18);
    transform:rotate(45deg);
    left:-250px;
    top:-210px;
}

.hero:after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border:1px solid rgba(197,163,90,.15);
    transform:rotate(45deg);
    right:-190px;
    bottom:-170px;
}

.hero-inner{
    min-height:570px;
    display:flex;
    align-items:center;
    position:relative;
    z-index:2;
    padding:85px 0;
}

.hero-content{
    max-width:850px;
}

.eyebrow{
    color:var(--gold2);
    font-size:14px;
    font-weight:700;
    letter-spacing:.5px;
    margin-bottom:16px;
}

.hero h1{
    font-size:56px;
    line-height:1.25;
    margin:0;
    font-weight:800;
}

.hero h1 span{
    display:block;
    color:var(--gold2);
    font-size:36px;
    direction:ltr;
    text-align:right;
    margin-top:7px;
}

.hero h2{
    font-size:23px;
    font-weight:400;
    margin:22px 0 12px;
}

.hero p{
    max-width:750px;
    color:#d5dde1;
    font-size:17px;
    margin:0 0 30px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
    padding:9px 22px;
    border-radius:4px;
    font-weight:700;
    font-size:14px;
    transition:.2s;
}

.btn-gold{
    background:var(--gold);
    color:#071c2c;
}

.btn-gold:hover{
    background:var(--gold2);
}

.btn-outline{
    border:1px solid rgba(255,255,255,.35);
    color:white;
}

.btn-outline:hover{
    border-color:var(--gold);
    color:var(--gold2);
}


/* =========================================================
   METRICS
========================================================= */

.metrics{
    background:white;
    margin-top:-45px;
    position:relative;
    z-index:10;
    box-shadow:0 15px 40px rgba(5,24,38,.10);
    border-radius:7px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    overflow:hidden;
}

.metric{
    padding:27px 20px;
    text-align:center;
    border-left:1px solid var(--line);
}

.metric:last-child{
    border-left:0;
}

.metric strong{
    display:block;
    font-size:26px;
    color:var(--navy);
}

.metric span{
    display:block;
    color:var(--muted);
    font-size:13px;
}


/* =========================================================
   SECTIONS
========================================================= */

.section{
    padding:90px 0;
}

.section-soft{
    background:var(--cream);
}

.section-dark{
    background:var(--navy);
    color:white;
}

.section-head{
    margin-bottom:45px;
}

.section-kicker{
    color:#9a7936;
    font-weight:800;
    font-size:13px;
}

.section-dark .section-kicker{
    color:var(--gold2);
}

.section-title{
    font-size:35px;
    line-height:1.35;
    color:var(--navy);
    margin:6px 0 10px;
}

.section-dark .section-title{
    color:white;
}

.section-line{
    width:58px;
    height:3px;
    background:var(--gold);
    margin:15px 0 20px;
}

.section-description{
    color:var(--muted);
    max-width:800px;
    font-size:16px;
}

.section-dark .section-description{
    color:#cad4da;
}

   ABOUT
========================================================= */

    display:grid;
    grid-template-columns:1.25fr .75fr;

    color:white;
    padding:36px;

    position:relative;
}

.quote-box:before{
    content:"“";
    color:var(--gold);
    font-size:90px;
    line-height:1;
    position:absolute;
    top:8px;
    left:20px;
    opacity:.35;
}

.quote-box h3{
    color:var(--gold2);
    margin-top:0;
    font-size:22px;
}

.quote-box p{
    color:#d8e0e4;
}


/* =========================================================
   STUDY AREAS
========================================================= */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card{
    background:white;
    border:1px solid #ece9e2;
    border-radius:7px;
    padding:30px;
    position:relative;
    overflow:hidden;
    transition:.25s;
}

.card:before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:100%;
    height:4px;
    background:var(--gold);
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 16px 35px rgba(7,28,44,.09);
}

.card-number{
    font-size:12px;
    color:#a88a4b;
    font-weight:800;
}

.card h3{
    color:var(--navy);
    margin:7px 0 10px;
    font-size:20px;
}

.card p{
    color:var(--muted);
    margin:0;
    font-size:14px;
}


/* =========================================================
   METHODOLOGY
========================================================= */

.method-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.method{
    border:1px solid rgba(255,255,255,.13);
    padding:27px;
    border-radius:6px;
    background:rgba(255,255,255,.035);
}

.method .num{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--gold);
    color:var(--gold2);
    border-radius:50%;
    font-weight:800;
    margin-bottom:16px;
}

.method h3{
    margin:0 0 8px;
    color:white;
}

.method p{
    color:#bdc9cf;
    font-size:14px;
    margin:0;
}

   STUDIES LIBRARY
========================================================= */

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

}

}

    border-color:#d0b774;
    box-shadow:0 8px 24px rgba(7,28,44,.06);
}

    display:inline-block;

}

    color:var(--navy);
    margin:0 0 5px;
    font-size:19px;
}

.study-item p{
    color:var(--muted);
    font-size:13px;
    margin:0;
}

.study-status{
    color:#9a7936;

    white-space:nowrap;
}


/* =========================================================
   GROUP SERVICES
========================================================= */

.services-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;

}


/* =========================================================
   VISION / MISSION
========================================================= */

.vm-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.vm{
    padding:35px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:6px;
}

.vm h3{
    color:var(--gold2);

}

.vm p{
    color:#d0dade;
    margin-bottom:0;

   VALUES
========================================================= */

.values{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:35px;
}

.value{

    padding:18px 10px;
    background:rgba(255,255,255,.04);

    color:#e0e7ea;
}

}

}

    margin:0;
