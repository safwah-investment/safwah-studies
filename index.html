<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مركز صفوة للدراسات والاستشارات</title>

<meta name="description"
content="مركز صفوة للدراسات والاستشارات - الدراسات الاستثمارية ودراسات الجدوى والعناية الواجبة ودراسات السوق والتحليل الاستراتيجي.">

<style>

:root{
  --navy:#0c1b2a;
  --navy2:#12283b;
  --gold:#c7a35a;
  --gold2:#e2c781;
  --cream:#f6f3ec;
  --white:#ffffff;
  --text:#17202a;
  --muted:#69727d;
  --line:#e6e1d7;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Tahoma, Arial, sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.9;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:#07131f;
  color:#d9dee3;
  font-size:13px;
  padding:8px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.topbar .group{
  color:var(--gold2);
  font-weight:bold;
  letter-spacing:.4px;
}

/* =========================
   NAVIGATION
========================= */

nav{
  height:76px;
  background:rgba(12,27,42,.98);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  color:white;
}

.logo-mark{
  width:47px;
  height:47px;
  border:1px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:var(--gold2);
  font-size:17px;
}

.brand-text strong{
  display:block;
  font-size:17px;
}

.brand-text span{
  display:block;
  font-size:10px;
  color:var(--gold2);
  letter-spacing:1.2px;
  direction:ltr;
}

.menu{
  display:flex;
  gap:27px;
  align-items:center;
}

.menu a{
  color:#eef1f3;
  font-size:14px;
  transition:.2s;
}

.menu a:hover{
  color:var(--gold2);
}

.menu .group-link{
  border:1px solid rgba(199,163,90,.65);
  padding:8px 17px;
  color:var(--gold2);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:620px;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(199,163,90,.13), transparent 30%),
    linear-gradient(135deg,#081522 0%,#10283b 60%,#0b1b29 100%);
}

.hero:before{
  content:"";
  position:absolute;
  width:480px;
  height:480px;
  border:1px solid rgba(199,163,90,.18);
  border-radius:50%;
  left:-180px;
  top:50px;
}

.hero:after{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:50%;
  left:-300px;
  top:-60px;
}

.hero-inner{
  width:88%;
  max-width:1200px;
  margin:auto;
  position:relative;
  z-index:2;
}

.eyebrow{
  color:var(--gold2);
  font-size:14px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:15px;
}

.hero h1{
  color:white;
  font-size:53px;
  line-height:1.35;
  margin:0;
  max-width:850px;
}

.hero h1 span{
  color:var(--gold2);
}

.hero-en{
  direction:ltr;
  text-align:right;
  color:#aeb9c3;
  font-size:20px;
  letter-spacing:2px;
  margin-top:7px;
}

.hero p{
  max-width:780px;
  color:#d3dbe1;
  font-size:18px;
  margin:25px 0 30px;
}

.hero-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:12px 24px;
  border:1px solid var(--gold);
  transition:.2s;
  font-weight:bold;
  font-size:14px;
}

.btn-primary{
  background:var(--gold);
  color:#0c1b2a;
}

.btn-primary:hover{
  background:var(--gold2);
}

.btn-outline{
  color:white;
}

.btn-outline:hover{
  background:white;
  color:var(--navy);
  border-color:white;
}

/* =========================
   STATS
========================= */

.stats{
  max-width:1100px;
  margin:-55px auto 0;
  position:relative;
  z-index:10;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:white;
  box-shadow:0 15px 40px rgba(0,0,0,.10);
}

.stat{
  padding:27px 20px;
  text-align:center;
  border-left:1px solid var(--line);
}

.stat:last-child{
  border-left:none;
}

.stat strong{
  display:block;
  font-size:24px;
  color:var(--navy);
}

.stat span{
  font-size:13px;
  color:var(--muted);
}

/* =========================
   COMMON
========================= */

.container{
  width:88%;
  max-width:1200px;
  margin:auto;
}

section{
  padding:90px 0;
}

.section-label{
  color:#9b7939;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
}

.section-title{
  font-size:34px;
  color:var(--navy);
  margin:5px 0 13px;
}

.section-intro{
  max-width:760px;
  color:var(--muted);
  margin-bottom:40px;
}

.gold-line{
  width:55px;
  height:3px;
  background:var(--gold);
  margin:17px 0 25px;
}

/* =========================
   ABOUT
========================= */

.about-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:70px;
  align-items:center;
}

.about-card{
  background:var(--navy);
  color:white;
  padding:45px;
  min-height:370px;
  position:relative;
  overflow:hidden;
}

.about-card:after{
  content:"SC";
  position:absolute;
  left:-15px;
  bottom:-65px;
  font-size:180px;
  color:rgba(255,255,255,.025);
  font-weight:bold;
  direction:ltr;
}

.about-card h3{
  color:var(--gold2);
  font-size:24px;
  margin-top:0;
}

.about-card p{
  color:#d2dae0;
}

.signature{
  border-top:1px solid rgba(255,255,255,.15);
  margin-top:30px;
  padding-top:20px;
  color:var(--gold2);
}

/* =========================
   SERVICES / PORTAL
========================= */

.portal{
  background:white;
}

.portal-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.portal-card{
  min-height:280px;
  padding:31px;
  background:#f8f7f3;
  border:1px solid #ebe7de;
  position:relative;
  overflow:hidden;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.portal-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(0,0,0,.08);
  border-color:var(--gold);
}

.portal-number{
  font-size:12px;
  color:#a98a4d;
  direction:ltr;
  text-align:right;
}

.portal-icon{
  width:49px;
  height:49px;
  border:1px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--navy);
  font-weight:bold;
  margin:22px 0;
}

.portal-card h3{
  color:var(--navy);
  margin:0 0 8px;
  font-size:20px;
}

.portal-card .en{
  direction:ltr;
  text-align:right;
  color:#9a814e;
  font-size:11px;
  letter-spacing:1px;
  margin-bottom:13px;
}

.portal-card p{
  color:var(--muted);
  font-size:14px;
  margin:0;
}

.portal-arrow{
  margin-top:auto;
  padding-top:20px;
  color:#a27d38;
  font-weight:bold;
}

/* =========================
   FEATURED STUDIES
========================= */

.studies-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.study-card{
  background:white;
  border:1px solid var(--line);
  transition:.3s;
}

.study-card:hover{
  box-shadow:0 15px 35px rgba(0,0,0,.08);
  transform:translateY(-4px);
}

.study-top{
  height:9px;
  background:var(--navy);
}

.study-content{
  padding:27px;
}

.study-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:11px;
  color:#98783e;
  margin-bottom:12px;
}

.study-card h3{
  color:var(--navy);
  font-size:19px;
  margin:0 0 12px;
}

.study-card p{
  color:var(--muted);
  font-size:14px;
}

.study-link{
  display:inline-block;
  margin-top:10px;
  color:#8b6b30;
  font-weight:bold;
  font-size:13px;
}

/* =========================
   METHODOLOGY
========================= */

.methodology{
  background:var(--navy);
  color:white;
}

.methodology .section-title{
  color:white;
}

.methodology .section-intro{
  color:#c5cfd6;
}

.steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  margin-top:45px;
}

.step{
  padding:25px 20px;
  border-top:1px solid rgba(255,255,255,.15);
  position:relative;
}

.step:before{
  content:"";
  width:13px;
  height:13px;
  background:var(--gold);
  border-radius:50%;
  position:absolute;
  top:-7px;
  right:20px;
}

.step span{
  color:var(--gold2);
  font-size:12px;
}

.step h4{
  margin:8px 0;
  font-size:17px;
}

.step p{
  color:#b9c5cd;
  font-size:13px;
}

/* =========================
   WHY CENTER
========================= */

.why-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.why{
  border-right:3px solid var(--gold);
  padding:5px 22px;
}

.why h3{
  color:var(--navy);
  margin-top:0;
}

.why p{
  color:var(--muted);
  font-size:14px;
}

/* =========================
   GROUP
========================= */

.group-section{
  background:#ede9df;
}

.group-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.group-brand{
  background:white;
  padding:40px;
  border-top:4px solid var(--gold);
}

.group-brand strong{
  display:block;
  color:var(--navy);
  font-size:27px;
}

.group-brand .english{
  color:#a17d3b;
  direction:ltr;
  text-align:right;
  letter-spacing:1.5px;
  font-size:17px;
}

.group-brand p{
  color:var(--muted);
}

/* =========================
   CTA
========================= */

.cta{
  background:linear-gradient(135deg,#b18c47,#d4b66d);
  padding:65px 0;
}

.cta-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
}

.cta h2{
  color:#0b1b29;
  font-size:31px;
  margin:0 0 8px;
}

.cta p{
  margin:0;
  color:#29323a;
}

.cta .btn{
  border-color:#0b1b29;
  color:#0b1b29;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#07131f;
  color:#aeb8c0;
  padding:60px 0 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:55px;
}

.footer-title{
  color:white;
  font-size:20px;
  margin-bottom:4px;
}

.footer-en{
  color:var(--gold2);
  font-size:12px;
  letter-spacing:1px;
  direction:ltr;
  text-align:right;
}

footer p,
footer li{
  font-size:13px;
}

footer ul{
  list-style:none;
  padding:0;
}

footer li{
  margin-bottom:8px;
}

footer h4{
  color:var(--gold2);
}

.footer-bottom{
  border-top:1px solid rgba(255,255,255,.1);
  margin-top:40px;
  padding-top:20px;
  text-align:center;
  font-size:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .menu{
    display:none;
  }

  .hero{
    min-height:570px;
  }

  .hero h1{
    font-size:39px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
    margin-top:0;
  }

  .about-grid,
  .group-grid{
    grid-template-columns:1fr;
    gap:35px;
  }

  .portal-grid,
  .studies-grid,
  .why-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .steps{
    grid-template-columns:1fr;
  }

  .step{
    border-top:none;
    border-right:1px solid rgba(255,255,255,.15);
  }

  .step:before{
    top:30px;
    right:-7px;
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .topbar{
    display
